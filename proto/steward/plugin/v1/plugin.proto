syntax = "proto3";

package steward.plugin.v1;

import "google/protobuf/struct.proto";

// The plugin contract. Every plugin serves PluginService: it describes itself, validates its config
// and, when it declares roles or permissions, grants access as a whole. A plugin that has resources
// also serves ResourceService, and one that runs applications serves ApplicationService. A plugin
// offers a call by implementing it. A call it does not offer fails with UNIMPLEMENTED, and Steward
// treats that as not offered. Within v1 the contract is additive only.
//
// Calls that change state are idempotent and return the result of the change, not a report of what
// changed: Steward keeps the state and works out the difference itself. Failures, such as an
// unreachable tool or an invalid request, are returned as gRPC errors.
//
// The file has the messages first, then the services at the bottom.

// ---------------------------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------------------------

// What a plugin is configured with for a call: its inputs and its secrets, which are kept, sent and
// logged separately. A plugin must not persist the secrets.
message PluginConfig {
  // Values for the inputs declared in PluginDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 1;

  // Values for the secrets declared in PluginDefinition.secrets, keyed by secret name. Resolved by
  // the runner for this call only.
  map<string, string> secrets = 2;
}

// Something in the tool that access can be granted to or that can be provisioned.
message Resource {
  // A kind declared in PluginDefinition.resources.
  string kind = 1;

  // The resource's name in the tool, such as a repository's full name. Steward stores it with the
  // kind and sends it on every later call, which is how a resource is identified.
  string name = 2;

  // Values for the inputs declared in ResourceDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ResourceDefinition.secrets, keyed by secret name. Resolved
  // by the runner for this call only, like PluginConfig.secrets.
  map<string, string> secrets = 4;

  // Values the resource produced, as declared in ResourceDefinition.outputs, keyed by output name.
  // Set by the plugin when it lists a resource; ignored on calls. Provision returns its outputs
  // separately. Values of outputs declared sensitive stay with the runner and are not passed on to
  // Steward.
  google.protobuf.Struct outputs = 5;
}

// Something deployed and run in the tool, as opposed to a resource, which is provisioned.
message Application {
  // A kind declared in PluginDefinition.applications.
  string kind = 1;

  // The application's identity in the tool.
  string id = 2;

  // Values for the inputs declared in ApplicationDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ApplicationDefinition.secrets, keyed by secret name.
  map<string, string> secrets = 4;

  // Values the application produced, as declared in ApplicationDefinition.outputs.
  google.protobuf.Struct outputs = 5;

  // What it is deployed from.
  ApplicationSource source = 6;

  // Its variables. Open-ended: the names are not declared by the plugin.
  repeated Variable variables = 7;
}

// Where an application is deployed from. The source types are a fixed set that Steward defines, each
// with its own configuration, so every plugin sees the same shapes:
//
//   github    { owner, name, branch? }    a GitHub repository
//   registry  { image, tag? }             a container image in a registry
//   s3        { bucket, key }             an archive in an S3 bucket
//   raw       { path }                    a path that is already there
message ApplicationSource {
  // One of ApplicationDefinition.sources.
  string type = 1;

  reserved 2;
  reserved "location";

  // The configuration of that type, as listed above.
  google.protobuf.Struct config = 4;

  // Pins an exact version: a commit, an image digest or an S3 object version id. Empty means the
  // newest of what the config names, such as its branch, tag or key.
  string ref = 3;
}

// One variable of an application, such as an environment variable. Unlike an input, its name is
// chosen by whoever sets it, and each variable carries its own protection.
message Variable {
  string name = 1;

  // For a sensitive variable, resolved by the runner for this call only.
  string value = 2;

  // The value is a secret, such as a key or a token.
  bool sensitive = 3;

  // The value cannot be viewed once it is set.
  bool sealed = 4;

  // The variable cannot be edited or deleted once it is set, such as APP_KEY, where a change would
  // break data the application has already encrypted.
  bool locked = 5;
}

// Who a user is in the tool, such as a GitHub login or an AWS principal.
//
// Every field is optional, so an identity can be as complete as Steward knows it. A call that needs
// more than it was given, such as a grant with neither an external_id nor an attr the tool can
// invite by, fails with INVALID_ARGUMENT.
message Identity {
  // Steward's own opaque identifier for the identity. A plugin does not interpret it; it is there
  // to correlate a call with what Steward recorded.
  optional string ulid = 1;

  // The identity in the tool, such as a GitHub login.
  optional string external_id = 2;

  // A display name, when known.
  optional string name = 3;

  // Anything else the tool may need, such as an email address for an invitation.
  google.protobuf.Struct attrs = 4;
}

// A role: one the tool defines itself, or one Steward composed from the permissions the plugin
// declares. A call that carries a role always names it. The permissions of a composed role travel
// beside it, in `permissions`.
message Role {
  string name = 1;
}

// One permission, in whatever form the tool uses. The name is the permission itself, such as
// "s3:GetObject", "DescribeStacks" or "pull_requests". The level qualifies it for tools whose
// permissions come in degrees, such as "read" or "write", and is unset for those whose do not.
// Steward does not interpret either; the plugin does.
message Permission {
  string name = 1;
  optional string level = 2;

  // What the permission allows, in words. Filled in when a plugin returns permissions, and ignored
  // on calls.
  optional string description = 3;
}

// ---------------------------------------------------------------------------------------------
// PluginService messages
// ---------------------------------------------------------------------------------------------

message DescribeRequest {}

message DescribeResponse {
  string name = 1;
  string version = 2;

  // What the plugin offers. A plugin that needs several tools takes the credentials for each as
  // secrets.
  PluginDefinition definition = 3;
}

message PluginDefinition {
  string title = 1;
  string description = 2;

  // The settings this plugin is configured with, such as a base URL or an organization name.
  repeated InputDefinition inputs = 3;

  // The credentials this plugin is configured with, such as an API token or a private key.
  repeated SecretDefinition secrets = 8;

  // The resource kinds this plugin manages. Kinds are unique within the plugin.
  repeated ResourceDefinition resources = 4;

  // What can be granted on the plugin as a whole, such as membership of a GitHub organization, a
  // user in a Jira site or an IAM user in an AWS account. Declaring permissions or roles is what
  // says the plugin supports access. They are separate lists: the permissions are the pieces
  // Steward composes its own roles from, and the roles are the ones the tool defines itself.
  repeated PermissionDefinition permissions = 5;
  repeated RoleDefinition roles = 6;

  // The application kinds this plugin can run, such as a Laravel app on a host. Applications are a
  // second kind of thing next to resources: they are deployed from a source and have variables that
  // people edit over time. Kinds are unique within the plugin. Empty when the plugin runs no
  // applications.
  repeated ApplicationDefinition applications = 7;
}

// One setting a plugin, a resource or an application takes, declared the way a variable is: a name
// and a type, with the value passed separately, keyed by `name`, in PluginConfig.inputs,
// Resource.inputs or Application.inputs.
message InputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;

  // One of "string", "number", "boolean", "select", "list" (of strings) or "map" (string keys and
  // values). The SDKs export these as constants, and `steward plugin validate` rejects any other.
  string type = 4;

  bool required = 5;

  // Used when no value is given.
  google.protobuf.Value default = 6;

  // The choices for a "select".
  repeated string options = 7;
}

// One credential a plugin, a resource or an application takes, such as an API token or a private
// key. Secrets are separate from inputs: they are stored, sent and shown differently. The value is
// passed in the `secrets` map, keyed by `name`, for one call only, and is never shown back once set.
message SecretDefinition {
  string name = 1;
  string description = 2;
  bool required = 3;
}

// One value a resource produces, declared like an input: a name and a type. Same types as an input.
message OutputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;
  string type = 4;

  // The value is a secret, such as a generated password. The plugin still returns it in
  // Resource.outputs, but the runner writes it to the customer's own secret store and reports only
  // a reference to Steward, which never sees or stores the value.
  bool sensitive = 5;
}

message ResourceDefinition {
  // Unique within the plugin, such as "repository".
  string kind = 1;
  string title = 2;
  string description = 3;

  // What is required to create a resource of this kind. Provision takes values for these.
  repeated InputDefinition inputs = 4;

  // The credentials a resource of this kind takes, separate from its inputs.
  repeated SecretDefinition secrets = 8;

  // What can be granted on this type. Declaring permissions or roles is what says the type supports
  // access. A tool may expose permissions, roles, or both, as separate lists. Steward lets
  // organizations build their own roles from the permissions.
  repeated PermissionDefinition permissions = 5;
  repeated RoleDefinition roles = 6;

  // What a resource of this kind produces, such as a URL or an ARN, known once it exists. The
  // values come back in Resource.outputs.
  repeated OutputDefinition outputs = 7;
}

// An application is deployable and has open-ended variables, which a resource has neither of. A
// resource has fixed inputs and outputs that the plugin declares; an application also has a source
// and variables whose names are chosen by the people who run it. Every declared application kind
// can be deployed and has variables.
message ApplicationDefinition {
  // Unique within the plugin, such as "laravel".
  string kind = 1;
  string title = 2;
  string description = 3;

  // Fixed settings of the application itself, such as a runtime or a region. Not its variables.
  repeated InputDefinition inputs = 4;

  // The credentials the application takes, separate from its inputs.
  repeated SecretDefinition secrets = 7;

  // The source types it can be deployed from, by name: "github", "registry", "s3" or "raw", as
  // described on ApplicationSource.
  repeated string sources = 5;

  // What it produces, such as its URL.
  repeated OutputDefinition outputs = 6;
}

message PermissionDefinition {
  string name = 1;
  string title = 2;
  string description = 3;

  // The levels the permission can be given at, such as "read" and "write". Empty for a permission
  // that has none.
  repeated string levels = 4;
}

// A role the tool defines itself.
message RoleDefinition {
  string name = 1;
  string title = 2;
  string description = 3;
}

message ValidateRequest {
  PluginConfig config = 1;
}

message ValidateResponse {
  // Problems with the inputs or credentials that the user can fix. Empty when the config is good.
  // Failures of the call itself are returned as gRPC errors instead.
  repeated ValidationError errors = 1;
}

message ValidationError {
  // The input the error is about. Empty when it is about the config as a whole.
  string field = 1;
  string message = 2;
}

// Access to the plugin as a whole, such as membership of a GitHub organization. Steward grants it
// before it grants access to the plugin's resources, and decides when to remove it.
//
// Idempotent: granting what is already granted succeeds.
message PluginServiceGrantAccessRequest {
  PluginConfig config = 1;
  Identity identity = 2;

  // Always set. For a role Steward composed, `permissions` are its pieces, which the plugin
  // applies as far as the tool allows. Empty for a role the tool defines.
  Role role = 3;
  repeated Permission permissions = 4;
}

message PluginServiceGrantAccessResponse {
  // The grant's own identity in the tool, such as a membership or invitation id. Empty when the
  // tool has none. Steward records it and sends it back on revoke.
  string id = 1;

  // What the tool actually applied. It can differ from what was requested: a composed role may land
  // as a native role, or as only the permissions the tool supports.
  Role role = 2;
  repeated Permission permissions = 4;

  // True when the grant needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds. Steward works out overlap between roles
// before it sends a revoke, so the role here is safe to remove in full.
message PluginServiceRevokeAccessRequest {
  PluginConfig config = 1;
  Identity identity = 2;
  Role role = 3;
  repeated Permission permissions = 5;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 4;
}

message PluginServiceRevokeAccessResponse {}

// Asks what an identity holds on the plugin now, for example to skip an invitation to someone who
// is already a member, or to find drift.
message PluginServiceGetAccessRequest {
  PluginConfig config = 1;
  Identity identity = 2;
}

message PluginServiceGetAccessResponse {
  // The roles and permissions the identity holds. Empty when it has none.
  repeated Role roles = 1;
  repeated Permission permissions = 4;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;

  // The identity as the tool knows it, with whatever the tool could resolve, such as the
  // external_id for someone who was found by email. Unset when no match was found.
  Identity identity = 3;
}

// ---------------------------------------------------------------------------------------------
// ResourceService messages
// ---------------------------------------------------------------------------------------------

// Access to one resource, such as a role on a repository. Steward grants it after the identity has
// access to the plugin.
//
// Idempotent: granting what is already granted succeeds.
message ResourceServiceGrantAccessRequest {
  PluginConfig config = 1;
  Resource resource = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 5;
}

message ResourceServiceGrantAccessResponse {
  // The grant's own identity in the tool, such as an assignment or invitation id. Empty when the
  // tool has none. Steward records it and sends it back on revoke.
  string id = 1;

  // What the tool actually applied. It can differ from what was requested: a composed role may land
  // as a native role, or as only the permissions the tool supports.
  Role role = 2;
  repeated Permission permissions = 4;

  // True when the grant needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds. Steward works out overlap between roles
// before it sends a revoke, so the role here is safe to remove in full.
message ResourceServiceRevokeAccessRequest {
  PluginConfig config = 1;
  Resource resource = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 6;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 5;
}

message ResourceServiceRevokeAccessResponse {}

// Asks what an identity holds on a resource now.
message ResourceServiceGetAccessRequest {
  PluginConfig config = 1;
  Resource resource = 2;
  Identity identity = 3;
}

message ResourceServiceGetAccessResponse {
  // The roles and permissions the identity holds on the resource. Empty when it has none.
  repeated Role roles = 1;
  repeated Permission permissions = 3;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;
}

// Idempotent: provisioning something that already exists with the same kind and name succeeds, and
// still returns its outputs. Steward works out what changed by comparing the state it stores.
message ResourceServiceProvisionRequest {
  PluginConfig config = 1;

  // The kind to create, as declared in PluginDefinition.resources.
  string kind = 2;

  // What to call it in the tool. Steward stores the name with the kind.
  string name = 3;

  // Its inputs, validated against the kind's definition.
  google.protobuf.Struct inputs = 4;

  // Values for the secrets the kind declares, keyed by secret name. Resolved by the runner for this
  // call only.
  map<string, string> secrets = 5;
}

message ResourceServiceProvisionResponse {
  // What the resource produced, as declared in ResourceDefinition.outputs, keyed by output name,
  // such as a URL or an id the tool assigned. Values of outputs declared sensitive stay with the
  // runner and are not passed on to Steward.
  google.protobuf.Struct outputs = 1;
}

// Idempotent: removing something that is already gone succeeds.
message ResourceServiceDeprovisionRequest {
  PluginConfig config = 1;
  Resource resource = 2;
}

message ResourceServiceDeprovisionResponse {}

message ResourceServiceListRequest {
  PluginConfig config = 1;
  string kind = 2;
  string page_token = 3;
}

message ResourceServiceListResponse {
  repeated Resource resources = 1;

  // Empty on the last page.
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------------------------
// ApplicationService messages
// ---------------------------------------------------------------------------------------------

// Idempotent: creating an application that already exists with the same identity returns it.
message ApplicationServiceCreateRequest {
  PluginConfig config = 1;

  // A kind declared in PluginDefinition.applications, with its inputs and secrets, where it is
  // deployed from, and its starting variables.
  string kind = 2;
  google.protobuf.Struct inputs = 3;
  map<string, string> secrets = 4;
  ApplicationSource source = 5;
  repeated Variable variables = 6;
}

message ApplicationServiceCreateResponse {
  // The application as it now exists, with its identity in the tool.
  Application application = 1;
}

// Idempotent: removing an application that is already gone succeeds.
message ApplicationServiceDestroyRequest {
  PluginConfig config = 1;
  Application application = 2;
}

message ApplicationServiceDestroyResponse {}

// Deploys the application from a source, replacing what is running. `application.variables` is the
// full set of variables to run it with, so a change to the variables is a deploy: a variable missing
// from it is removed. A locked variable cannot be changed or removed, and the call fails with
// FAILED_PRECONDITION.
message ApplicationServiceDeployRequest {
  PluginConfig config = 1;
  Application application = 2;
  // What to deploy. Unset means redeploy from the application's current source.
  ApplicationSource source = 3;
}

message ApplicationServiceDeployResponse {
  // The application after the deploy was started, with its outputs.
  Application application = 1;
}

// ---------------------------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------------------------

// Mandatory for every plugin. Describe and Validate are always served. GrantAccess, RevokeAccess and
// GetAccess apply only to a plugin that declares roles or permissions, and answer UNIMPLEMENTED
// otherwise.
service PluginService {
  // Describes the plugin: what it needs (its inputs) and the resources it manages.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Checks a config, for example that the inputs are valid and the credentials work.
  rpc Validate(ValidateRequest) returns (ValidateResponse);

  // Access to the plugin as a whole: giving identities roles on it, taking them away, and checking
  // what they hold.
  rpc GrantAccess(PluginServiceGrantAccessRequest) returns (PluginServiceGrantAccessResponse);
  rpc RevokeAccess(PluginServiceRevokeAccessRequest) returns (PluginServiceRevokeAccessResponse);
  rpc GetAccess(PluginServiceGetAccessRequest) returns (PluginServiceGetAccessResponse);
}

// For plugins that manage resources. A call a resource kind does not offer answers UNIMPLEMENTED.
// GrantAccess, RevokeAccess and GetAccess are offered by kinds that declare roles or permissions.
service ResourceService {
  rpc GrantAccess(ResourceServiceGrantAccessRequest) returns (ResourceServiceGrantAccessResponse);
  rpc RevokeAccess(ResourceServiceRevokeAccessRequest) returns (ResourceServiceRevokeAccessResponse);
  rpc GetAccess(ResourceServiceGetAccessRequest) returns (ResourceServiceGetAccessResponse);
  rpc Provision(ResourceServiceProvisionRequest) returns (ResourceServiceProvisionResponse);
  rpc Deprovision(ResourceServiceDeprovisionRequest) returns (ResourceServiceDeprovisionResponse);
  rpc List(ResourceServiceListRequest) returns (ResourceServiceListResponse);
}

// For plugins that run applications (PluginDefinition.applications): deployable things with a source
// and open-ended variables.
service ApplicationService {
  rpc Create(ApplicationServiceCreateRequest) returns (ApplicationServiceCreateResponse);
  rpc Destroy(ApplicationServiceDestroyRequest) returns (ApplicationServiceDestroyResponse);
  rpc Deploy(ApplicationServiceDeployRequest) returns (ApplicationServiceDeployResponse);
}
