name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
          token: ${{ secrets.BUF_TOKEN }}

  js:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          token: ${{ secrets.BUF_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - run: npm ci
      - run: buf generate
      - run: npm run build

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          token: ${{ secrets.BUF_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: buf generate
      - run: python -m build

      # What is published is the built wheel, not the source tree, so install that in a clean environment
      # and import it. A wheel that left out the generated messages would pass every other step.
      - name: The built wheel works on its own
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "from steward_sdk.plugin import create_plugin"

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          token: ${{ secrets.BUF_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # On main, the Generate workflow regenerates the committed code when the contract changes. For pull
      # requests and releases, stale generated code is an error to fix, not to commit.
      - name: The committed generated code is current
        if: github.ref != 'refs/heads/main'
        run: |
          buf generate

          if ! git diff --quiet -- gen; then
            echo "go/gen is out of date: run \`buf generate\` in go/ and commit the result" >&2
            git diff --stat -- gen
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

  templates:
    name: Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Each template names an SDK that exists
        run: |
          for manifest in templates/*/template.json; do
            sdk=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['sdk'])" "$manifest")

            if [ ! -d "$sdk" ]; then
              echo "$manifest names the sdk '$sdk', which is not a folder here" >&2
              exit 1
            fi
          done
