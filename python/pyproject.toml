[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treno-dev-steward-sdk"
version = "0.1.0rc4"
description = "The Steward SDK for Python: write Steward plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.84.0",
  "grpcio-health-checking>=1.84.0",
  "protobuf>=7.36.2",
]

[project.urls]
Repository = "https://github.com/treno-dev/steward-sdk"

[project.optional-dependencies]
dev = ["build"]

# The generated contract is not committed, so git ignores it, and a build leaves out what git ignores
# unless it is listed here. `python -m build` makes the source distribution first and builds the wheel
# from that, so both have to carry it.
[tool.hatch.build.targets.sdist]
artifacts = ["src/steward_sdk/_gen"]

[tool.hatch.build.targets.wheel]
packages = ["src/steward_sdk"]
artifacts = ["src/steward_sdk/_gen"]
