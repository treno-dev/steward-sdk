[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treno-dev-steward-sdk"
version = "0.1.0rc2"
description = "The Steward SDK for Python: write Steward plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.84.0",
  "grpcio-health-checking>=1.84.0",
  "protobuf>=7.36.2",
]

[project.urls]
Repository = "https://github.com/treno-dev/steward-sdk"

[project.optional-dependencies]
dev = ["build"]

[tool.hatch.build.targets.wheel]
packages = ["src/steward_sdk"]
# The generated contract is not committed, so it is not in git; the wheel still carries it.
artifacts = ["src/steward_sdk/_gen"]
