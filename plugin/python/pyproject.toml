[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steward-plugin"
version = "0.1.0"
description = "The Python SDK for writing Steward plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.84.0",
  "grpcio-health-checking>=1.84.0",
  "protobuf>=7.36.2",
]

[project.optional-dependencies]
dev = ["build"]

[tool.hatch.build.targets.wheel]
packages = ["src/steward_plugin"]
# The generated contract is not committed, so it is not in git; the wheel still carries it.
artifacts = ["src/steward_plugin/_gen"]
