version: v2
inputs:
  - directory: ../../proto
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/treno-dev/steward/sdk/plugin/go/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
